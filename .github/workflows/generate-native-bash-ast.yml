name: One-time generate pinned Bash AST JS on PR branch
on:
  push:
    branches:
      - port/native-bash-ast-security-2188
    paths:
      - scripts/generate-original-bash-ast.mjs
      - packages/runtime/src/legacy-bash-ast-source/**
      - .github/workflows/generate-native-bash-ast.yml
permissions:
  contents: write
jobs:
  generate:
    if: github.repository == 'wwxst/agent-cil'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate original parser JS from user-owned source
        run: node scripts/generate-original-bash-ast.mjs
      - name: Commit generated JS only to this open PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/runtime/src/legacy-permissions/generated
          if ! git diff --cached --quiet; then
            git commit -m "build(bash): commit reproducible original AST JavaScript"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
