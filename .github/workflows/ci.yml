name: Node.js CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Syntax-check protocol source
        run: find packages/protocol/src packages/protocol/test -name '*.js' -print0 | xargs -0 -n1 node --check
